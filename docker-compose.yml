# PostgresAI monitoring: pgai-mon (collector, Parquet store, SQL endpoint, push
# ingest, RDS host stats) + Grafana + the checkup reporter.
#
# Resource limits: pgai-mon 1 vCPU / 1.5 GiB, Grafana 0.5 / 0.5 GiB, reporter
# 1 / 1.75 GiB (it runs once a day), instance-jobs 0.25 / 0.25 GiB: about
# 4 GiB of limits in all, against ~7.3 GiB for the pgwatch + VictoriaMetrics
# stack this replaces. Limits are caps, not reservations; the services rarely
# peak together. Every limit can be overridden from .env (see .env.example).
#
# Storage: PGAI_MON_STORE. Unset: the pgai_mon_data volume holds the store.
# s3://bucket/prefix: Parquet goes to the bucket (credentials from the instance
# role / default AWS chain); the volume keeps only the write-ahead log and cache.
#
# Ports are published on 127.0.0.1 only. pgai-mon needs a bearer token
# (PGAI_MON_TOKEN) on every route but /livez.

x-pgai-mon-owner: &pgai_mon_owner "${PGAI_MON_USER:-${INSTANCE_JOBS_USER:-10001:10001}}"

services:
  # Copies Grafana provisioning, dashboards and demo-DB scripts from the image
  # into the postgres_ai_configs volume, and hands pgai_mon_data to the user
  # pgai-mon runs as. Idempotent; exits when done.
  config-init:
    image: ${PGAI_REGISTRY:-postgresai}/postgres-ai-configs:${PGAI_TAG:?PGAI_TAG is required}
    container_name: postgres-ai-config-init
    volumes:
      - postgres_ai_configs:/target
      - pgai_mon_data:/pgai_mon_data
    environment:
      - TARGET_DIR=/target
      - PGAI_MON_DATA_DIR=/pgai_mon_data
      - PGAI_MON_OWNER=${PGAI_MON_USER:-${INSTANCE_JOBS_USER:-10001:10001}}

  # Target Database - The PostgreSQL database being monitored (demo only).
  # Behind the demo profile: `mon local-install --demo` turns it on.
  target-db:
    image: postgres:17
    container_name: target-db
    profiles: ["demo"]
    cpus: ${TARGET_DB_CPUS:-0.2}
    mem_limit: ${TARGET_DB_MEM:-805306368}
    environment:
      POSTGRES_DB: target_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # 01-create-replicator.sh rejects an empty value so the demo never starts
      # streaming replication with a known fallback password.
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-}
    entrypoint:
      [
        "bash",
        "/postgres_ai_configs/scripts/postgres-entrypoint.sh",
        "target-db",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
        "-c",
        "wal_level=logical",
        "-c",
        "max_prepared_transactions=10",
        "-c",
        "max_replication_slots=10",
        "-c",
        "max_wal_senders=10",
      ]
    volumes:
      - target_db_data:/var/lib/postgresql/data
      - postgres_ai_configs:/postgres_ai_configs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d target_database"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      config-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Hot standby used by xmin-horizon integration coverage when explicitly started.
  target-standby:
    image: postgres:17
    container_name: target-standby
    profiles: ["demo"]
    cpus: ${TARGET_STANDBY_CPUS:-0.2}
    mem_limit: ${TARGET_STANDBY_MEM:-805306368}
    environment:
      PGDATA: /var/lib/postgresql/data
      # The command below rejects an empty value so the standby cannot loop with
      # a known fallback password.
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-}
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -Eeuo pipefail
        : "$${REPLICATOR_PASSWORD:?REPLICATOR_PASSWORD is required}"
        if [ ! -s "$${PGDATA}/PG_VERSION" ]; then
          rm -rf "$${PGDATA:?}"/*
          until pg_isready -h target-db -U postgres; do
            sleep 2
          done
          until PGPASSWORD="$${REPLICATOR_PASSWORD}" pg_basebackup -h target-db -D "$${PGDATA}" -U replicator -R -X stream; do
            rm -rf "$${PGDATA:?}"/*
            sleep 2
          done
          echo "hot_standby_feedback = on" >> "$${PGDATA}/postgresql.auto.conf"
        fi
        exec docker-entrypoint.sh postgres -c max_prepared_transactions=10
    volumes:
      - target_standby_data:/var/lib/postgresql/data
    depends_on:
      - target-db
    restart: unless-stopped

  # pgai-mon: collects the targets in instances.yml (re-read on change), stores
  # Parquet, serves read-only SQL to Grafana, the reporter and instance-jobs, and
  # takes pushed samples (host metrics). Config: /etc/pgai-mon/pgai-mon.yml in
  # the image (mon/docker/pgai-mon.yml).
  pgai-mon:
    image: ${PGAI_REGISTRY:-postgresai}/pgai-mon:${PGAI_TAG:?PGAI_TAG is required}
    container_name: pgai-mon
    # instances.yml and host-metrics/ are owner-only (they hold passwords and
    # API keys), so pgai-mon runs as their owner: the install user that
    # `mon local-install` writes as INSTANCE_JOBS_USER (or PGAI_MON_USER).
    # Unset: the image's unprivileged user.
    user: *pgai_mon_owner
    cpus: ${PGAI_MON_CPUS:-1.0}
    mem_limit: ${PGAI_MON_MEM:-1610612736}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      # Never logged and never in argv. The full token (the CLI uses it) may
      # also write: push ingest.
      PGAI_MON_TOKEN: ${PGAI_MON_TOKEN:?PGAI_MON_TOKEN is required (postgresai mon local-install generates it)}
      # The read-only token: queries, no writes. Grafana, the reporter and
      # instance-jobs send it, so a Grafana user cannot push samples through
      # the datasource. Unset: they send the full token.
      PGAI_MON_READ_TOKEN: ${PGAI_MON_READ_TOKEN:-}
      # Empty: the local store in pgai_mon_data. s3://bucket/prefix: the bucket.
      PGAI_MON_STORE: ${PGAI_MON_STORE:-}
      # Days of metrics and of query texts kept (empty: 14 and 30; 0: forever).
      PGAI_MON_RETENTION_DAYS: ${PGAI_MON_RETENTION_DAYS:-}
      PGAI_MON_TEXTS_RETENTION_DAYS: ${PGAI_MON_TEXTS_RETENTION_DAYS:-}
      # The old stack's retention settings: an upgraded install keeps what its
      # operator set, unless the two variables above say otherwise.
      VM_RETENTION_PERIOD: ${VM_RETENTION_PERIOD:-}
      QUERYID_RETENTION_HOURS: ${QUERYID_RETENTION_HOURS:-}
      AWS_REGION: ${AWS_REGION:-}
      # Explicit S3 credentials. Empty: the SDK's default chain (an EC2
      # instance role reaches containers only with IMDS hop limit 2).
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # RDS / Aurora host stats (CloudWatch, Performance Insights, Enhanced
      # Monitoring) for one instance, written as host_* series.
      RDS_DB_INSTANCE_IDENTIFIER: ${RDS_DB_INSTANCE_IDENTIFIER:-}
      RDS_ROLE_ARN: ${RDS_ROLE_ARN:-}
      RDS_EXTERNAL_ID: ${RDS_EXTERNAL_ID:-}
      RDS_POLL_INTERVAL_SECONDS: ${RDS_POLL_INTERVAL_SECONDS:-60}
      PGAI_CLUSTER: ${PGAI_CLUSTER:-}
      PGAI_NODE_NAME: ${PGAI_NODE_NAME:-}
      HOME: /var/lib/pgai-mon
    volumes:
      - pgai_mon_data:/var/lib/pgai-mon
      - ./instances.yml:/etc/pgai-mon/instances.yml:ro
      # Supabase / ClickHouse scrape files written by `mon targets add`.
      - ./host-metrics:/etc/pgai-mon/host-metrics:ro
    healthcheck:
      # /livez needs no credentials and returns no data. The image has bash but
      # no HTTP client.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8765 && printf 'GET /livez HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      config-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Grafana. On by default; GRAFANA_SCALE=0 leaves it out (nothing depends on it).
  grafana:
    image: grafana/grafana:12.3.2
    container_name: grafana-with-datasources
    scale: ${GRAFANA_SCALE:-1}
    cpus: ${GRAFANA_CPUS:-0.5}
    mem_limit: ${GRAFANA_MEM:-536870912}
    environment:
      GF_SECURITY_ADMIN_USER: monitor
      # No default: the CLI generates one at install (.pgwatch-config) and passes it.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required (the Grafana admin password; set it in .env)}
      # Infinity: the datasource that runs pgai-mon SQL.
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_PATHS_PROVISIONING: /postgres_ai_configs/grafana/provisioning
      GF_PATHS_CONFIG: /postgres_ai_configs/grafana/provisioning/grafana.ini
      GF_FEATURE_TOGGLES_ENABLE: grafanaconThemes
      # OAuth configuration (disabled by default, enabled via Ansible)
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OAUTH_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: ${GRAFANA_OAUTH_NAME:-PostgresAI}
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: ${GRAFANA_OAUTH_ALLOW_SIGN_UP:-true}
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: ${GRAFANA_OAUTH_SCOPES:-openid email profile}
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GRAFANA_OAUTH_AUTH_URL:-}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${GRAFANA_OAUTH_TOKEN_URL:-}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${GRAFANA_OAUTH_API_URL:-}
      # Optional: disable login form when OAuth is primary auth
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_DISABLE_LOGIN_FORM:-false}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-}
      # Read by provisioning/datasources/pgai-mon.yml (the pgai-mon datasource's bearer token).
      PGAI_MON_TOKEN: ${PGAI_MON_READ_TOKEN:-${PGAI_MON_TOKEN:?PGAI_MON_TOKEN is required for Grafana datasource provisioning}}
    ports:
      # Unset: 127.0.0.1 only. GRAFANA_BIND_HOST= (empty, as terraform's
      # grafana_bind_host = "") or 0.0.0.0: opens it beyond this host.
      - "${GRAFANA_BIND_HOST-127.0.0.1:}3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - postgres_ai_configs:/postgres_ai_configs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      config-init:
        condition: service_completed_successfully
      pgai-mon:
        condition: service_started
    restart: unless-stopped

  # PostgreSQL Reports Generator - first run 3 minutes after start once every
  # target has data (at most 30 more minutes), then daily
  postgres-reports:
    image: ${PGAI_REGISTRY:-postgresai}/reporter:${PGAI_TAG:?PGAI_TAG is required}
    container_name: postgres-reports
    cpus: ${POSTGRES_REPORTS_CPUS:-1.0}
    mem_limit: ${POSTGRES_REPORTS_MEM:-1879048192}
    working_dir: /app
    volumes:
      - ./.pgwatch-config:/app/.pgwatch-config:ro
      - ./instances.yml:/app/instances.yml:ro
      - postgres_ai_configs:/postgres_ai_configs:ro
    environment:
      - PGAI_MON_URL=http://pgai-mon:8765
      - PGAI_MON_TOKEN=${PGAI_MON_READ_TOKEN:-${PGAI_MON_TOKEN:?PGAI_MON_TOKEN is required}}
      # The target list: the same file pgai-mon collects.
      - REPORTER_SOURCES_PATH=/app/instances.yml
      # Upload checkup reports to the SAME platform that provisioned the
      # instance. The console/SI passes the platform URL to the CLI as
      # PGAI_API_BASE_URL (postgres-ai/postgres_ai-ansible) and it is in the
      # environment when the CLI runs `docker compose up`; reuse it so reports
      # upload to that backend instead of the production default. Empty
      # (standalone CLI / unset) → api_url in .pgwatch-config, then the default
      # (https://postgres.ai/api/general) is used, so production is unchanged.
      # See postgres-ai/platform-all#338.
      - REPORTER_API_URL=${PGAI_API_BASE_URL:-}
      # A preview platform behind Cloudflare Access: its service token (unset in
      # production; the reporter sends it only when both are set).
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID:-}
      - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET:-}
      # Optional overrides:
      # - REPORTER_INITIAL_DELAY_SECONDS=180
      # - REPORTER_READINESS_TIMEOUT_SECONDS=1800 (0 = no wait for data)
      # - REPORTER_READINESS_POLL_SECONDS=15
      # - REPORTER_RETRY_SECONDS=1800 (after a failed run)
      # - REPORTER_INTERVAL_SECONDS=86400
      # - REPORTER_OUTPUT_TEMPLATE=/app/all_reports_%Y%m%d_%H%M%S.json
      # - REPORTER_API_URL=https://postgres.ai/api/general
      # - REPORTER_PROJECT_NAME=postgres-ai-monitoring
      # - REPORTER_PGWATCH_CONFIG_PATH=/app/.pgwatch-config
    depends_on:
      config-init:
        condition: service_completed_successfully
      pgai-mon:
        condition: service_healthy
    command: ["bash", "/postgres_ai_configs/scripts/postgres-reports.sh"]
    restart: unless-stopped

  # Instance jobs - collection runs HERE and the results are posted out.
  # Profile-gated, so an upgrade brings the definition and starts nothing;
  # no published port (the Supabase relay listens on the compose network only)
  # and the one mount is the credential file the reporter already uses.
  # See instance-jobs/README.md and postgresai#366.
  instance-jobs:
    image: ${PGAI_REGISTRY:-postgresai}/instance-jobs:${PGAI_TAG:?PGAI_TAG is required}
    container_name: instance-jobs
    profiles: ["instance-jobs"]
    # .pgwatch-config is 0600 owned by the install user, deliberately (the CLI
    # chmods it back on every write), so the container has to BE that owner:
    # the install writes its uid:gid here. Unset falls back to the image's own
    # unprivileged user, which then cannot read the file and says so - a loud
    # failure, where a root default would have run every un-provisioned box
    # privileged and silent. See instance-jobs/README.md.
    user: "${INSTANCE_JOBS_USER:-}"
    cpus: ${INSTANCE_JOBS_CPUS:-0.25}
    mem_limit: ${INSTANCE_JOBS_MEM:-268435456}
    read_only: true
    # noexec/nosuid: the tmpfs is the only writable path left, so it must not be
    # somewhere a compromised process can drop and run a binary.
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./.pgwatch-config:/app/.pgwatch-config:ro
    environment:
      - PGAI_SUPABASE_HOST_METRICS=${PGAI_SUPABASE_HOST_METRICS:-false}
      # Internal compose listener only; never publish this port.
      - PGAI_SUPABASE_METRICS_LISTEN=:9188
      - PGAI_MON_URL=http://pgai-mon:8765
      - PGAI_MON_TOKEN=${PGAI_MON_READ_TOKEN:-${PGAI_MON_TOKEN:?PGAI_MON_TOKEN is required}}
      # Post results to the SAME platform that provisioned this instance, the
      # way the reporter does. Empty falls back to the production default, and
      # a HAND-WRITTEN api_base_url in .pgwatch-config wins over both (nothing
      # in this repo writes that key; it is there for an operator override).
      - PGAI_API_BASE_URL=${PGAI_API_BASE_URL:-}
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID:-}
      - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET:-}
      # The install now writes instance_id into .pgwatch-config on both
      # registration paths, and that is the value this service prefers. This
      # stays as a fallback for a box installed before that, where the id only
      # ever existed in the environment the provisioning flow set.
      - PGAI_INSTANCE_ID=${PGAI_INSTANCE_ID:-}
      - PGAI_MONITORING_INSTANCE_ID=${PGAI_MONITORING_INSTANCE_ID:-}
    depends_on:
      pgai-mon:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_ai_configs:
  target_db_data:
  target_standby_data:
  # The store (local mode) or the write-ahead log and cache (S3 mode).
  pgai_mon_data:
  grafana_data:

networks:
  default:
    # Enable IPv6 on the project's default bridge network so containers can
    # reach IPv6-only databases. Notably required for Supabase free-tier
    # direct hosts (db.<ref>.supabase.co), which only resolve to IPv6.
    #
    # Override: set PGAI_ENABLE_IPV6=false (in your shell or .env) if the
    # host's Docker daemon cannot create an IPv6 network. Compose interpolates
    # this value into a YAML boolean, so only the exact strings `true`,
    # `false`, `yes`, `no` are accepted (lowercase). Numeric `0`/`1` and
    # casing like `True`/`False` are rejected by Compose with a confusing
    # "invalid boolean" error — use `true`/`false`.
    enable_ipv6: ${PGAI_ENABLE_IPV6:-true}
