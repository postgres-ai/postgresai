# Resource limits are configured for a 4 vCPU / 8 GiB RAM host.
# Total allocation: ~4.1 vCPUs, ~7.3 GiB RAM (with headroom for host OS).
# CPU overcommitment is intentional - containers rarely hit limits simultaneously.
#
# pgwatch-prometheus collects metrics including pg_stat_statements
# (top 100 queries by exec_time_total, filtered: calls >= 3 AND exec_time >= 1000ms).

services:
  # Config Initializer - Copies static configs from image to volume
  config-init:
    image: ${PGAI_REGISTRY:-postgresai}/postgres-ai-configs:${PGAI_TAG:?PGAI_TAG is required}
    container_name: postgres-ai-config-init
    volumes:
      - postgres_ai_configs:/target
    environment:
      - TARGET_DIR=/target

  # Sources Generator - Generates sources.yml files from instances.yaml template
  sources-generator:
    image: bash:5.2
    container_name: sources-generator
    working_dir: /app
    volumes:
      - ./instances.yml:/app/instances.yaml:ro
      - postgres_ai_configs:/postgres_ai_configs
    depends_on:
      config-init:
        condition: service_completed_successfully
    command:
      ["bash", "/postgres_ai_configs/scripts/generate-pgwatch-sources.sh"]

  # Target Database - The PostgreSQL database being monitored (demo only)
  target-db:
    image: postgres:17
    container_name: target-db
    cpus: ${TARGET_DB_CPUS:-0.2}
    mem_limit: ${TARGET_DB_MEM:-805306368}
    environment:
      POSTGRES_DB: target_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # 01-create-replicator.sh rejects an empty value so the demo never starts
      # streaming replication with a known fallback password.
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-}
    entrypoint:
      [
        "bash",
        "/postgres_ai_configs/scripts/postgres-entrypoint.sh",
        "target-db",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
        "-c",
        "wal_level=logical",
        "-c",
        "max_prepared_transactions=10",
        "-c",
        "max_replication_slots=10",
        "-c",
        "max_wal_senders=10",
      ]
    volumes:
      - target_db_data:/var/lib/postgresql/data
      - postgres_ai_configs:/postgres_ai_configs:ro
    depends_on:
      config-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Hot standby used by xmin-horizon integration coverage when explicitly started.
  target-standby:
    image: postgres:17
    container_name: target-standby
    cpus: ${TARGET_STANDBY_CPUS:-0.2}
    mem_limit: ${TARGET_STANDBY_MEM:-805306368}
    environment:
      PGDATA: /var/lib/postgresql/data
      # The command below rejects an empty value so the standby cannot loop with
      # a known fallback password.
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD:-}
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -Eeuo pipefail
        : "$${REPLICATOR_PASSWORD:?REPLICATOR_PASSWORD is required}"
        if [ ! -s "$${PGDATA}/PG_VERSION" ]; then
          rm -rf "$${PGDATA:?}"/*
          until pg_isready -h target-db -U postgres; do
            sleep 2
          done
          until PGPASSWORD="$${REPLICATOR_PASSWORD}" pg_basebackup -h target-db -D "$${PGDATA}" -U replicator -R -X stream; do
            rm -rf "$${PGDATA:?}"/*
            sleep 2
          done
          echo "hot_standby_feedback = on" >> "$${PGDATA}/postgresql.auto.conf"
        fi
        exec docker-entrypoint.sh postgres -c max_prepared_transactions=10
    volumes:
      - target_standby_data:/var/lib/postgresql/data
    depends_on:
      - target-db
    restart: unless-stopped

  # Postgres Sink - Storage for metrics in PostgreSQL format
  # Note: pg_hba.conf is configured to allow passwordless connections (trust)
  # for local connections within the Docker network. This simplifies pgwatch
  # and postgres-exporter connectivity without compromising security since
  # the database is not exposed externally.
  sink-postgres:
    image: postgres:17
    container_name: sink-postgres
    cpus: ${SINK_POSTGRES_CPUS:-0.4}
    mem_limit: ${SINK_POSTGRES_MEM:-1073741824}
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    entrypoint:
      [
        "bash",
        "/postgres_ai_configs/scripts/postgres-entrypoint.sh",
        "sink-postgres",
      ]
    volumes:
      - sink_postgres_data:/var/lib/postgresql/data
      - postgres_ai_configs:/postgres_ai_configs:ro
    depends_on:
      config-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # VictoriaMetrics Sink - Storage for metrics in Prometheus format
  sink-prometheus:
    image: victoriametrics/victoria-metrics:v1.140.0
    container_name: sink-prometheus
    cpus: ${SINK_PROMETHEUS_CPUS:-0.75}
    mem_limit: ${SINK_PROMETHEUS_MEM:-1610612736}
    ports:
      - "${BIND_HOST:-}59090:9090"
    volumes:
      - victoria_metrics_data:/victoria-metrics-data
      - postgres_ai_configs:/postgres_ai_configs:ro
    environment:
      - VM_AUTH_USERNAME=${VM_AUTH_USERNAME:-}
      - VM_AUTH_PASSWORD=${VM_AUTH_PASSWORD:-}
      - VM_RETENTION_PERIOD=${VM_RETENTION_PERIOD:-336h}
      - VM_QUERY_DURATION=${VM_QUERY_DURATION:-30s}
      - VM_MAX_CONCURRENT_REQUESTS=${VM_MAX_CONCURRENT_REQUESTS:-16}
      # Query guardrails: a runaway dashboard query must fail with an error,
      # not OOM-kill the whole store (infra#98, verified live on a customer host:
      # maxUniqueTimeseries=50000 did not engage, 20000 did). Coherence rule:
      # VM_MAX_MEMORY_PER_QUERY <= SINK_PROMETHEUS_MEM / 3; raise both together.
      - VM_MAX_MEMORY_PER_QUERY=${VM_MAX_MEMORY_PER_QUERY:-512MiB}
      - VM_MAX_UNIQUE_TIMESERIES=${VM_MAX_UNIQUE_TIMESERIES:-20000}
      - VM_MEMORY_ALLOWED_PERCENT=${VM_MEMORY_ALLOWED_PERCENT:-60}
      # Free-form extra flags, so a host-level tuning survives `mon update`
      # re-downloading this file. Example: VM_EXTRA_ARGS=-search.maxSeries=40000
      - VM_EXTRA_ARGS=${VM_EXTRA_ARGS:-}
      # Admin-endpoint keys (#359). Grafana's datasource proxy filters POST but
      # passes every GET through, and VictoriaMetrics demands no key when these
      # are empty, so a Viewer token could wipe the store through the proxy.
      # VM_PPROF_AUTH_KEY closes /debug/pprof/*, which the proxy could otherwise
      # reach: heap and goroutine dumps are both a disclosure and a DoS lever.
      # It is also what made the first cut of this fix bypassable, back when the
      # keys were flag values and /debug/pprof/cmdline served them verbatim.
      # Minted per install by `postgresai mon local-install` / `mon update`;
      # deliberately given to nothing that reads metrics.
      - VM_DELETE_AUTH_KEY=${VM_DELETE_AUTH_KEY:-}
      - VM_SNAPSHOT_AUTH_KEY=${VM_SNAPSHOT_AUTH_KEY:-}
      - VM_FORCE_MERGE_AUTH_KEY=${VM_FORCE_MERGE_AUTH_KEY:-}
      - VM_PPROF_AUTH_KEY=${VM_PPROF_AUTH_KEY:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Secrets go to files, never onto the command line: argv is served
        # verbatim by /debug/pprof/cmdline, which the Grafana datasource proxy
        # can reach with the credentials it already holds, and shows up in the
        # host process table (#359). They remain container env vars, so
        # `docker inspect` still shows them - that needs the Docker socket.
        set -e
        KEYS=/tmp/vm-keys
        umask 077
        mkdir -p "$$KEYS"
        rand_key() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
        # An EMPTY key file is the one fail-OPEN case: VictoriaMetrics then
        # requires no key at all, while a missing file is refused. So check the
        # file after writing it, not just the value we meant to write - a full
        # disk on a box whose job is storing metrics is not hypothetical.
        put_key() {
          val=$$2
          [ -n "$$val" ] || val=$$(rand_key)
          printf '%s' "$$val" > "$$KEYS/$$1" || true
          if [ ! -s "$$KEYS/$$1" ]; then
            echo "sink-prometheus: admin key '$$1' is empty, refusing to start (#359)" >&2
            exit 1
          fi
          # Explicit, not umask-dependent: every caller must get 0600 whatever
          # the surrounding umask happens to be.
          chmod 600 "$$KEYS/$$1"
        }
        put_key delete "$$VM_DELETE_AUTH_KEY"
        put_key snapshot "$$VM_SNAPSHOT_AUTH_KEY"
        put_key force_merge "$$VM_FORCE_MERGE_AUTH_KEY"
        put_key pprof "$$VM_PPROF_AUTH_KEY"
        ADMIN_ARGS="-deleteAuthKey=file://$$KEYS/delete -snapshotAuthKey=file://$$KEYS/snapshot -forceMergeAuthKey=file://$$KEYS/force_merge -pprofAuthKey=file://$$KEYS/pprof"
        AUTH_ARGS=""
        if [ -n "$$VM_AUTH_USERNAME" ] && [ -n "$$VM_AUTH_PASSWORD" ]; then
          put_key http_password "$$VM_AUTH_PASSWORD"
          AUTH_ARGS="-httpAuth.username=$$VM_AUTH_USERNAME -httpAuth.password=file://$$KEYS/http_password"
        fi
        # Restore the default umask before exec: VictoriaMetrics inherits it,
        # and 077 would silently tighten the metrics volume, which outlives the
        # container. The key files are chmod'ed explicitly, so this is safe.
        umask 022
        # ADMIN_ARGS is last on purpose: Go's flag package lets a flag repeat
        # and the last occurrence wins, so VM_EXTRA_ARGS must not be able to
        # disarm the admin keys the way it can override a tuning flag.
        exec /victoria-metrics-prod -storageDataPath=/victoria-metrics-data -retentionPeriod="$$VM_RETENTION_PERIOD" -httpListenAddr=:9090 -promscrape.config=/postgres_ai_configs/prometheus/prometheus.yml -promscrape.config.strictParse=false -promscrape.maxScrapeSize=128000000 -search.maxQueryDuration="$${VM_QUERY_DURATION}" -search.maxConcurrentRequests="$${VM_MAX_CONCURRENT_REQUESTS}" -search.maxMemoryPerQuery="$${VM_MAX_MEMORY_PER_QUERY}" -search.maxUniqueTimeseries="$${VM_MAX_UNIQUE_TIMESERIES}" -memory.allowedPercent="$${VM_MEMORY_ALLOWED_PERCENT}" $$AUTH_ARGS $$VM_EXTRA_ARGS $$ADMIN_ARGS
    depends_on:
      config-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # PGWatch Instance 1 - Monitoring service (Postgres sink)
  pgwatch-postgres:
    image: ${PGAI_REGISTRY:-postgresai}/pgwatch:${PGAI_TAG:?PGAI_TAG is required}
    build:
      context: ./pgwatch
    container_name: pgwatch-postgres
    cpus: ${PGWATCH_POSTGRES_CPUS:-0.35}
    mem_limit: ${PGWATCH_POSTGRES_MEM:-536870912}
    command:
      [
        "--sources=/postgres_ai_configs/pgwatch/sources.yml",
        "--metrics=/postgres_ai_configs/pgwatch/metrics.yml",
        "--sink=postgresql://pgwatch@sink-postgres:5432/measurements?sslmode=disable",
        "--web-addr=:8080",
        "--log-level=error",
      ]
    depends_on:
      sources-generator:
        condition: service_completed_successfully
      sink-postgres:
        condition: service_started
    volumes:
      - postgres_ai_configs:/postgres_ai_configs:ro
    restart: unless-stopped

  # PGWatch Instance 2 - Monitoring service (Prometheus sink)
  pgwatch-prometheus:
    image: ${PGAI_REGISTRY:-postgresai}/pgwatch:${PGAI_TAG:?PGAI_TAG is required}
    build:
      context: ./pgwatch
    container_name: pgwatch-prometheus
    cpus: ${PGWATCH_PROMETHEUS_CPUS:-0.5}
    mem_limit: ${PGWATCH_PROMETHEUS_MEM:-536870912}
    command:
      [
        "--sources=/postgres_ai_configs/pgwatch-prometheus/sources.yml",
        "--metrics=/postgres_ai_configs/pgwatch-prometheus/metrics.yml",
        "--sink=prometheus://0.0.0.0:9091/pgwatch",
        "--web-addr=:8089",
        "--log-level=error",
      ]
    depends_on:
      sources-generator:
        condition: service_completed_successfully
      sink-prometheus:
        condition: service_started
    volumes:
      - postgres_ai_configs:/postgres_ai_configs:ro
    restart: unless-stopped

  # Grafana with datasources - Visualization layer
  grafana:
    image: grafana/grafana:12.3.2
    container_name: grafana-with-datasources
    cpus: ${GRAFANA_CPUS:-0.5}
    mem_limit: ${GRAFANA_MEM:-536870912}
    environment:
      GF_SECURITY_ADMIN_USER: monitor
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-demo}
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_PATHS_PROVISIONING: /postgres_ai_configs/grafana/provisioning
      GF_PATHS_CONFIG: /postgres_ai_configs/grafana/provisioning/grafana.ini
      GF_FEATURE_TOGGLES_ENABLE: grafanaconThemes
      # OAuth configuration (disabled by default, enabled via Ansible)
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OAUTH_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: ${GRAFANA_OAUTH_NAME:-PostgresAI}
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: ${GRAFANA_OAUTH_ALLOW_SIGN_UP:-true}
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: ${GRAFANA_OAUTH_SCOPES:-openid email profile}
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GRAFANA_OAUTH_AUTH_URL:-}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${GRAFANA_OAUTH_TOKEN_URL:-}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${GRAFANA_OAUTH_API_URL:-}
      # Optional: disable login form when OAuth is primary auth
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_DISABLE_LOGIN_FORM:-false}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-}
      VM_AUTH_USERNAME: ${VM_AUTH_USERNAME:?VM_AUTH_USERNAME is required for Grafana datasource provisioning}
      VM_AUTH_PASSWORD: ${VM_AUTH_PASSWORD:?VM_AUTH_PASSWORD is required for Grafana datasource provisioning}
    ports:
      - "${GRAFANA_BIND_HOST:-}3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - postgres_ai_configs:/postgres_ai_configs:ro
    depends_on:
      config-init:
        condition: service_completed_successfully
      sink-postgres:
        condition: service_started
      sink-prometheus:
        condition: service_started
    restart: unless-stopped
  monitoring_flask_backend:
    image: ${PGAI_REGISTRY:-postgresai}/monitoring-flask-backend:${PGAI_TAG:?PGAI_TAG is required}
    container_name: flask-pgss-api
    cpus: ${FLASK_CPUS:-0.5}
    mem_limit: ${FLASK_MEM:-1073741824}
    environment:
      - FLASK_ENV=production
      - PROMETHEUS_URL=http://sink-prometheus:9090
      - POSTGRES_SINK_URL=postgresql://pgwatch@sink-postgres:5432/measurements
      - VM_AUTH_USERNAME=${VM_AUTH_USERNAME:-}
      - VM_AUTH_PASSWORD=${VM_AUTH_PASSWORD:-}
      - QUERYID_RETENTION_HOURS=${QUERYID_RETENTION_HOURS:-720}
      # Optional overrides:
      # - ENABLE_AMP=true (enable Amazon Managed Prometheus support)
      # - AWS_REGION=us-east-1 (AWS region for Amazon Managed Prometheus)
    depends_on:
      - sink-prometheus
      - sink-postgres
    restart: unless-stopped

  # PostgreSQL Reports Generator - Runs reports after 30 minutes
  postgres-reports:
    image: ${PGAI_REGISTRY:-postgresai}/reporter:${PGAI_TAG:?PGAI_TAG is required}
    container_name: postgres-reports
    cpus: ${POSTGRES_REPORTS_CPUS:-1.0}
    mem_limit: ${POSTGRES_REPORTS_MEM:-1879048192}
    working_dir: /app
    volumes:
      - ./.pgwatch-config:/app/.pgwatch-config:ro
      - postgres_ai_configs:/postgres_ai_configs:ro
    environment:
      - PROMETHEUS_URL=http://sink-prometheus:9090
      - VM_AUTH_USERNAME=${VM_AUTH_USERNAME:-}
      - VM_AUTH_PASSWORD=${VM_AUTH_PASSWORD:-}
      # Upload checkup reports to the SAME platform that provisioned the
      # instance. The console/SI passes the platform URL to the CLI as
      # PGAI_API_BASE_URL (postgres-ai/postgres_ai-ansible) and it is in the
      # environment when the CLI runs `docker compose up`; reuse it so reports
      # upload to that backend instead of the production default. Empty
      # (standalone CLI / unset) → the wrapper's REPORTER_API_URL default
      # (https://postgres.ai/api/general) is used, so production is unchanged.
      # See postgres-ai/platform-all#338.
      - REPORTER_API_URL=${PGAI_API_BASE_URL:-}
      # Optional overrides:
      # - REPORTER_INITIAL_DELAY_SECONDS=1800
      # - REPORTER_INTERVAL_SECONDS=86400
      # - REPORTER_OUTPUT_TEMPLATE=/app/all_reports_%Y%m%d_%H%M%S.json
      # - REPORTER_API_URL=https://postgres.ai/api/general
      # - REPORTER_PROJECT_NAME=postgres-ai-monitoring
      # - REPORTER_PGWATCH_CONFIG_PATH=/app/.pgwatch-config
      # - ENABLE_AMP=true (enable Amazon Managed Prometheus support)
      # - AWS_REGION=us-east-1 (AWS region for Amazon Managed Prometheus)
    depends_on:
      config-init:
        condition: service_completed_successfully
      sink-prometheus:
        condition: service_started
      pgwatch-prometheus:
        condition: service_started
    command: ["bash", "/postgres_ai_configs/scripts/postgres-reports.sh"]
    restart: unless-stopped

  # Self-monitoring components (may have reduced functionality on macOS)

  # cAdvisor - Container metrics (self-monitoring)
  # Note: ghcr.io/google/cadvisor tags omit the 'v' prefix
  # (upstream registry convention; different from other images here).
  self-cadvisor:
    image: ghcr.io/google/cadvisor:0.56.2
    container_name: self-cadvisor
    cpus: ${CADVISOR_CPUS:-0.25}
    mem_limit: ${CADVISOR_MEM:-402653184}
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
      - "--disable_metrics=percpu,sched,tcp,udp,hugetlb,referenced_memory,cpu_topology,resctrl"
      - "--store_container_labels=false"
    restart: unless-stopped

  # Node Exporter - System metrics (self-monitoring)
  self-node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: self-node-exporter
    cpus: ${NODE_EXPORTER_CPUS:-0.05}
    mem_limit: ${NODE_EXPORTER_MEM:-100663296}
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  # Postgres Exporter - Metrics for sink-postgres (self-monitoring)
  self-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: self-postgres-exporter
    cpus: ${POSTGRES_EXPORTER_CPUS:-0.1}
    mem_limit: ${POSTGRES_EXPORTER_MEM:-134217728}
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@sink-postgres:5432/measurements?sslmode=disable"
    depends_on:
      - sink-postgres
    restart: unless-stopped

volumes:
  postgres_ai_configs:
  target_db_data:
  target_standby_data:
  sink_postgres_data:
  victoria_metrics_data:
  grafana_data:

networks:
  default:
    # Enable IPv6 on the project's default bridge network so containers can
    # reach IPv6-only databases. Notably required for Supabase free-tier
    # direct hosts (db.<ref>.supabase.co), which only resolve to IPv6.
    #
    # Override: set PGAI_ENABLE_IPV6=false (in your shell or .env) if the
    # host's Docker daemon cannot create an IPv6 network. Compose interpolates
    # this value into a YAML boolean, so only the exact strings `true`,
    # `false`, `yes`, `no` are accepted (lowercase). Numeric `0`/`1` and
    # casing like `True`/`False` are rejected by Compose with a confusing
    # "invalid boolean" error — use `true`/`false`.
    enable_ipv6: ${PGAI_ENABLE_IPV6:-true}
