# Example pgai-mon config: the demo target of instances.demo.yml.
# Paths are the ones the image (mon/Dockerfile) ships; for a local run from the repo root use
#   metrics_yml: config/pgwatch-prometheus/metrics.yml
#   macros_sql: mon/sql/macros.sql
#   store_dir: mon/.data/dev
store_dir: /var/lib/pgai-mon
metrics_yml: /etc/pgai-mon/metrics.yml
macros_sql: /usr/share/pgai-mon/macros.sql
preset: full
sources:
  - name: target_database
    conn_str: postgresql://monitor:monitor_pass@target-db:5432/target_database
    discover_databases: true
    custom_tags: {env: demo, cluster: local, node_name: node-01}
    # Labels VictoriaMetrics added at scrape time; keep them for series identical to the old stack.
    scrape_labels: {job: pgwatch-prometheus, instance: "pgwatch:9091"}
# jsonlog / auto_explain directories to tail (optional):
# logs:
#   - dir: /var/log/postgresql
#     suffix: .json
# Prometheus scrape files written by `postgresai mon targets add` (Supabase, ClickHouse Cloud):
scrape:
  files: [/etc/pgai/host-metrics/*.yml]
store:
  flush_interval_s: 60
http:
  listen: 0.0.0.0:8765
  # Every route but /healthz needs these credentials (or PGAI_MON_AUTH_* in the environment).
  auth:
    token_file: /run/secrets/pgai-mon-token
    # username: pgai
    # password_file: /run/secrets/pgai-mon-password
