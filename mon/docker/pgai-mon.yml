# pgai-mon config of the docker-compose stack (baked into the image as
# /etc/pgai-mon/pgai-mon.yml). Secrets never go here: the bearer token comes from
# PGAI_MON_TOKEN (or a token file), AWS credentials from the default chain.
#
# Store: the pgai_mon_data volume. PGAI_MON_STORE=s3://bucket/prefix moves the
# Parquet files to the bucket; the volume then keeps the write-ahead log and cache.
store_dir: /var/lib/pgai-mon/store
# Retention, as the old stack had it: 14 days of metrics, 30 days of query texts.
# PGAI_MON_RETENTION_DAYS and PGAI_MON_TEXTS_RETENTION_DAYS override (0 keeps everything).
store:
  retention_days: 14
  texts_retention_days: 30
metrics_yml: /etc/pgai-mon/metrics.yml
macros_sql: /usr/share/pgai-mon/macros.sql
preset: full
# The targets `postgresai mon targets add/remove` maintain (compose mounts the
# project's instances.yml here); re-read on change (see restart_on_replaced_files).
sources_file: /etc/pgai-mon/instances.yml
# compose mounts instances.yml as a single file, which keeps the inode it was mounted
# with: a tool that replaces the file (sed -i, Ansible, mv) leaves pgai-mon on the old
# one. pgai-mon then exits (code 75) and Docker restarts it with the new file (#523).
# An edit in place is re-read within collector.reload_interval_s, with no restart.
restart_on_replaced_files: true
# Host metrics: the scrape files `postgresai mon targets add` writes for Supabase and
# ClickHouse Cloud (compose mounts the project's host-metrics/ here); re-read on change.
#
# The monitoring host itself (compose services self-node-exporter and self-cadvisor),
# for the self-monitoring dashboard: only the series it charts are kept.
scrape:
  files: [/etc/pgai/host-metrics/*.yml]
  jobs:
    - job_name: self-node-exporter
      scrape_interval: 30s
      static_configs:
        - targets: [self-node-exporter:9100]
      metric_relabel_configs:
        - source_labels: [__name__]
          regex: node_cpu_seconds_total|node_memory_(MemTotal|MemFree|MemAvailable|Buffers|Cached|SReclaimable)_bytes|node_filesystem_(size|avail)_bytes|node_disk_(reads_completed|writes_completed|read_bytes|written_bytes|io_time_seconds|read_time_seconds|write_time_seconds)_total
          action: keep
    - job_name: self-cadvisor
      scrape_interval: 30s
      static_configs:
        - targets: [self-cadvisor:8080]
      metric_relabel_configs:
        - source_labels: [__name__]
          regex: container_(last_seen|cpu_usage_seconds_total|memory_usage_bytes|network_(receive|transmit)_bytes_total|fs_(reads|writes)_bytes_total)
          action: keep
        # The root container's network is the host's: keep its real interfaces only.
        - source_labels: [id, interface]
          regex: "/;(lo|veth.*|br-.*|docker.*)"
          action: drop
http:
  # Inside the compose network only; compose publishes it on 127.0.0.1.
  listen: 0.0.0.0:8765
