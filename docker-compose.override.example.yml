services:
  # Example local-dev override file.
  #
  # Usage:
  #   cp docker-compose.override.example.yml docker-compose.override.yml
  #
  # Docker Compose automatically loads docker-compose.override.yml (no -f needed).

  # Use local repo Grafana provisioning, dashboards and demo-DB scripts instead
  # of the published postgres-ai-configs image. Copies into the shared volume
  # (postgres_ai_configs); the dashboards directory mirrors the source exactly.
  config-init:
    image: alpine:3.22.0
    container_name: postgres-ai-config-init
    volumes:
      - postgres_ai_configs:/target
      - ./config:/src/config:ro
      - ./mon/grafana/dashboards:/src/dashboards:ro
      - pgai_mon_data:/pgai_mon_data
    environment:
      - TARGET_DIR=/target
      - PGAI_MON_OWNER=${PGAI_MON_USER:-${INSTANCE_JOBS_USER:-10001:10001}}
    command:
      [
        "sh",
        "-lc",
        "set -eu; \
         mkdir -p /target/grafana/provisioning /target/grafana/dashboards /target/target-db /target/scripts; \
         cp -a /src/config/grafana/provisioning/. /target/grafana/provisioning/; \
         find /target/grafana/dashboards -mindepth 1 -delete; \
         cp -a /src/dashboards/. /target/grafana/dashboards/; \
         cp -a /src/config/target-db/. /target/target-db/; \
         cp -a /src/config/scripts/. /target/scripts/; \
         chown \"$${PGAI_MON_OWNER}\" /pgai_mon_data; \
         echo \"config-init (local): copied ./config and mon/grafana/dashboards -> postgres_ai_configs volume\""
      ]

  # Run pgai-mon from a locally built image (see docker-compose.local.yml), or
  # point it at a config of your own:
  # pgai-mon:
  #   image: local/pgai-mon:dev
  #   volumes:
  #     - ./my-pgai-mon.yml:/etc/pgai-mon/pgai-mon.yml:ro

  # Alternate mode: run/debug the reporter inside Docker with local code.
  #
  # postgres-reports:
  #   volumes:
  #     - ./reporter/postgres_reports.py:/app/postgres_reports.py
  #     - ./reporter/reporter:/app/reporter
  #   environment:
  #     - REPORTER_INITIAL_DELAY_SECONDS=0
  #     # Set to 1 to enable debugpy attach on port 5679
  #     - DEBUGPY_REPORTER=${DEBUGPY_REPORTER:-0}
  #   ports:
  #     - "127.0.0.1:5679:5679"

  # Optional: expose demo DB too (only useful if you run `target-db`)
  # target-db:
  #   ports:
  #     - "127.0.0.1:55432:5432"
