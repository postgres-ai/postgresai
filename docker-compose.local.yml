
services:
  # Local development override: build configs from source (context: repo root,
  # the image ships mon/grafana/dashboards)
  config-init:
    build:
      context: .
      dockerfile: config/Dockerfile
      args:
        VERSION: local-dev
        BUILD_TS: "${BUILD_TS:-local}"
    image: local/configs:dev

  # Local development override: build pgai-mon from source (a cold build
  # compiles DuckDB: several minutes)
  pgai-mon:
    build:
      context: .
      dockerfile: mon/Dockerfile
    image: local/pgai-mon:dev

  # Local development override: build reporter from source
  postgres-reports:
    build:
      context: ./reporter
      args:
        VERSION: local-dev
        BUILD_TS: "${BUILD_TS:-local}"
    image: local/reporter:dev

  # Override Grafana port to avoid conflict with local dev server
  grafana:
    ports:
      - "127.0.0.1:3001:3000"
