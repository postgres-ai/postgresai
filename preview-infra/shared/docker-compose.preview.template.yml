# Preview environment for PostgresAI monitoring
# Uses the same architecture as main project with CI-built images:
# pgai-mon (collector, store, SQL), Grafana, the reporter, a demo target.
# envsubst variables: BRANCH_SLUG, GRAFANA_PASSWORD, PGAI_REGISTRY, PGAI_TAG.
# PGAI_MON_TOKEN is left for compose to read from the preview's .env
# (deploy.sh generates it).
#
# NOTE: GF_SERVER_ROOT_URL is required for Grafana to work behind Traefik reverse proxy
# NOTE: Anonymous access enabled with Viewer role for preview verification

services:
  # Config Initializer - Copies Grafana provisioning, dashboards and scripts from the CI-built image
  config-init:
    image: ${PGAI_REGISTRY}/postgres-ai-configs:${PGAI_TAG}
    volumes:
      - postgres_ai_configs:/target
    environment:
      - TARGET_DIR=/target
    labels:
      - "pgai.preview=true"

  # Target Database - PostgreSQL being monitored
  target-db:
    image: postgres:17
    mem_limit: 512m
    cpus: 0.3
    environment:
      POSTGRES_DB: target_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    entrypoint:
      [
        "bash",
        "/postgres_ai_configs/scripts/postgres-entrypoint.sh",
        "target-db",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
      ]
    volumes:
      - target_db_data:/var/lib/postgresql/data
      - postgres_ai_configs:/postgres_ai_configs:ro
    depends_on:
      config-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - "pgai.preview=true"

  # pgai-mon - collects instances.yml, stores Parquet (local volume: previews
  # are short-lived), serves SQL to Grafana and the reporter
  pgai-mon:
    image: ${PGAI_REGISTRY}/pgai-mon:${PGAI_TAG}
    mem_limit: 768m
    cpus: 0.5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PGAI_MON_TOKEN: "${PGAI_MON_TOKEN:?PGAI_MON_TOKEN is required}"
    volumes:
      - pgai_mon_data:/var/lib/pgai-mon
      - ./instances.yml:/etc/pgai-mon/instances.yml:ro
    depends_on:
      config-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8765 && printf 'GET /livez HTTP/1.0\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    labels:
      - "pgai.preview=true"

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:12.3.2
    mem_limit: 256m
    cpus: 0.25
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD}"
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_PATHS_PROVISIONING: /postgres_ai_configs/grafana/provisioning
      GF_PATHS_CONFIG: /postgres_ai_configs/grafana/provisioning/grafana.ini
      GF_FEATURE_TOGGLES_ENABLE: grafanaconThemes
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SERVER_ROOT_URL: "https://preview-${BRANCH_SLUG}.pgai.watch/"
      # Infinity datasource bearer token (datasources.yml)
      PGAI_MON_TOKEN: "${PGAI_MON_TOKEN:?PGAI_MON_TOKEN is required}"
    volumes:
      - grafana_data:/var/lib/grafana
      - postgres_ai_configs:/postgres_ai_configs:ro
    depends_on:
      config-init:
        condition: service_completed_successfully
      pgai-mon:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default
      - traefik-public
    labels:
      - "pgai.preview=true"
      - "traefik.enable=true"
      - "traefik.http.routers.preview-${BRANCH_SLUG}.rule=Host(`preview-${BRANCH_SLUG}.pgai.watch`)"
      - "traefik.http.routers.preview-${BRANCH_SLUG}.entrypoints=websecure"
      - "traefik.http.routers.preview-${BRANCH_SLUG}.tls.certresolver=letsencrypt"
      - "traefik.http.services.preview-${BRANCH_SLUG}.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-public"

  # Workload generator
  workload:
    image: postgres:17
    mem_limit: 128m
    cpus: 0.1
    depends_on:
      target-db:
        condition: service_healthy
    volumes:
      - ./workload:/workload:ro
    entrypoint: ["/bin/bash", "/workload/pgbench-variable.sh"]
    environment:
      PGHOST: target-db
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: target_database
    restart: unless-stopped
    labels:
      - "pgai.preview=true"

  # Reporter - Generates health check reports (K003, etc.) every 10 minutes,
  # with the entrypoint of the main stack. Uploads only when deploy.sh wrote an
  # API key into .pgwatch-config (PGAI_API_TOKEN set for the deploy).
  #   docker logs preview-${BRANCH_SLUG}-reporter-1
  reporter:
    image: ${PGAI_REGISTRY}/reporter:${PGAI_TAG}
    mem_limit: 512m
    cpus: 0.2
    depends_on:
      config-init:
        condition: service_completed_successfully
      pgai-mon:
        condition: service_healthy
    environment:
      PGAI_MON_URL: "http://pgai-mon:8765"
      PGAI_MON_TOKEN: "${PGAI_MON_TOKEN:?PGAI_MON_TOKEN is required}"
      REPORTER_SOURCES_PATH: /app/instances.yml
      REPORTER_INITIAL_DELAY_SECONDS: "120"
      REPORTER_READINESS_TIMEOUT_SECONDS: "600"
      REPORTER_INTERVAL_SECONDS: "600"
      REPORTER_OUTPUT_TEMPLATE: "/app/reports/all_reports_%Y%m%d_%H%M%S.json"
      REPORTER_API_URL: "${PGAI_API_URL:-}"
    volumes:
      - ./instances.yml:/app/instances.yml:ro
      - ./.pgwatch-config:/app/.pgwatch-config:ro
      - postgres_ai_configs:/postgres_ai_configs:ro
      - reporter_data:/app/reports
    command: ["bash", "/postgres_ai_configs/scripts/postgres-reports.sh"]
    restart: unless-stopped
    labels:
      - "pgai.preview=true"

networks:
  default:
    name: preview-${BRANCH_SLUG}
  traefik-public:
    external: true

volumes:
  postgres_ai_configs:
  target_db_data:
  pgai_mon_data:
  grafana_data:
  reporter_data:
