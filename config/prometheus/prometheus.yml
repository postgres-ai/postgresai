global:
  scrape_interval: 15s        # Default scrape interval
  evaluation_interval: 15s    # Default evaluation interval
  scrape_timeout: 10s         # Global scrape timeout

# VictoriaMetrics single-node ignores rule_files; the vmalert service
# evaluates host_rules.yml (host_* vocabulary, docs/host-metrics.md).
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_config_files: ['/etc/pgai/host-metrics/*.yml']

scrape_configs:
  # Main monitoring target: pgwatch metrics
  - job_name: 'pgwatch-prometheus'
    static_configs:
      - targets: ['pgwatch-prometheus:9091']
    scrape_interval: 30s      # How often to scrape PGWatch
    scrape_timeout: 25s       # Timeout for each scrape (must be < scrape_interval)
    metrics_path: /pgwatch
    # Backstop against a runaway cardinality explosion — NOT a working ceiling.
    # sample_limit is all-or-nothing: one sample over the cap and the entire
    # scrape is discarded and this target goes up=0. It never truncates, so a
    # snug limit costs every pgwatch series at once, silently. A `full` preset
    # on a large database reaches ~12.7k samples in steady state, which the
    # previous 10000 rejected outright. The real cardinality control is the
    # per-metric top-100 cap in config/pgwatch-prometheus/metrics.yml.
    sample_limit: 50000

  # Self-monitoring: Victoria Metrics internal metrics
  # Note: VictoriaMetrics expands percent-brace env vars in this file (not standard Prometheus)
  - job_name: 'victoriametrics'
    basic_auth:
      username: '%{VM_AUTH_USERNAME}'
      password: '%{VM_AUTH_PASSWORD}'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s

  # Self-monitoring: Docker container metrics via cAdvisor
  - job_name: 'self-cadvisor'
    static_configs:
      - targets: ['self-cadvisor:8080']
    scrape_interval: 30s

  # Self-monitoring: System metrics via Node Exporter
  - job_name: 'self-node-exporter'
    static_configs:
      - targets: ['self-node-exporter:9100']
    scrape_interval: 30s

  # Self-monitoring: Sink Postgres database metrics
  - job_name: 'self-postgres-exporter'
    static_configs:
      - targets: ['self-postgres-exporter:9187']
    scrape_interval: 30s

  # Query info metrics for chart legend display names
  # Creates pgwatch_query_info{queryid, displayname} metrics used with group_left()
  # Query texts are stable, so we scrape infrequently to reduce storage
  - job_name: 'query-info'
    static_configs:
      - targets: ['monitoring_flask_backend:8000']
    scrape_interval: 300s     # 5 minutes - query texts rarely change
    scrape_timeout: 30s
    metrics_path: /query_info_metrics
    # Safety net only — the per-metric LIMIT 100 in pgwatch metrics.yml
    # is the primary cardinality control. Each active queryid emits ~8-9
    # labeled samples, so 500 would cap at ~55-60 queryids and silently
    # drop the whole scrape on any busy cluster. 5000 gives ~550 queryids
    # of headroom, well clear of what the top-100 caps can produce.
    sample_limit: 5000

  # Each monitoring instance relays host metrics for one Supabase project.
  # The target exists only when PGAI_SUPABASE_HOST_METRICS=true; otherwise it
  # is dropped, so boxes without the feature carry no failing up=0 target.
  # sources-generator writes the target file from instances.yml with the
  # cluster/node_name tags of the Supabase target, the labels pgwatch uses.
  - job_name: 'supabase-host-metrics'
    scrape_interval: 60s
    scrape_timeout: 20s
    metrics_path: /supabase/metrics
    file_sd_configs:
      - files: ['/postgres_ai_configs/prometheus/supabase-host-metrics.json']
    relabel_configs:
      - target_label: __tmp_enabled
        replacement: '%{PGAI_SUPABASE_HOST_METRICS}'
      - source_labels: [__tmp_enabled]
        regex: '(?i)\s*true\s*'
        action: keep
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'node_cpu_seconds_total|node_memory_.*|node_disk_.*|node_network_.*_bytes_total|node_filesystem_.*|node_load.*'
        action: keep
