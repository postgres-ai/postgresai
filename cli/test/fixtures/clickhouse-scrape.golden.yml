- job_name: clickhouse-my-postgres
  scheme: https
  metrics_path: /v1/organizations/ca04a310-730d-4ce0-93dd-39f2cd2d5e6f/postgres/0c330583-6396-86d0-82cd-ed0f23b0d38c/prometheus
  scrape_interval: 60s
  scrape_timeout: 30s
  basic_auth:
    username: test-key-id
    password_file: /etc/pgai/host-metrics/clickhouse-my-postgres.secret
  static_configs:
    - targets:
        - api.clickhouse.cloud
      labels:
        cluster: default
        node_name: my-postgres
  metric_relabel_configs:
    - source_labels:
        - __name__
      regex: PostgresServiceInfo|PostgresServer_.*
      action: keep
