# Test fixture: the monitoring compose file as the CLI expects it (services and
# variables from the monitoring v4 contract). Not the shipped compose file.
services:
  config-init:
    image: ${PGAI_REGISTRY:-postgresai}/postgres-ai-configs:${PGAI_TAG:?PGAI_TAG is required}
    volumes:
      - postgres_ai_configs:/target

  pgai-mon:
    image: ${PGAI_REGISTRY:-postgresai}/pgai-mon:${PGAI_TAG:?PGAI_TAG is required}
    ports:
      - "127.0.0.1:${PGAI_MON_PORT:-8765}:8765"
    environment:
      PGAI_MON_TOKEN: ${PGAI_MON_TOKEN:?PGAI_MON_TOKEN is required}
      PGAI_MON_STORE: ${PGAI_MON_STORE:-}
      RDS_DB_INSTANCE_IDENTIFIER: ${RDS_DB_INSTANCE_IDENTIFIER:-}
      AWS_REGION: ${AWS_REGION:-}
      PGAI_CLUSTER: ${PGAI_CLUSTER:-}
      PGAI_NODE_NAME: ${PGAI_NODE_NAME:-}
    volumes:
      - ./instances.yml:/etc/pgai-mon/instances.yml:ro
      - ./host-metrics:/etc/pgai/host-metrics:ro
      - pgai_mon_data:/var/lib/pgai-mon
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
      PGAI_MON_TOKEN: ${PGAI_MON_TOKEN:?PGAI_MON_TOKEN is required}
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  postgres-reports:
    image: ${PGAI_REGISTRY:-postgresai}/reporter:${PGAI_TAG:?PGAI_TAG is required}
    environment:
      PGAI_MON_TOKEN: ${PGAI_MON_TOKEN:?PGAI_MON_TOKEN is required}
    volumes:
      - ./.pgwatch-config:/app/.pgwatch-config
    restart: unless-stopped

  instance-jobs:
    profiles: ["instance-jobs"]
    image: ${PGAI_REGISTRY:-postgresai}/instance-jobs:${PGAI_TAG:?PGAI_TAG is required}
    user: ${INSTANCE_JOBS_USER:-65532:65532}
    environment:
      PGAI_MON_TOKEN: ${PGAI_MON_TOKEN:?PGAI_MON_TOKEN is required}
    volumes:
      - ./.pgwatch-config:/etc/pgai/.pgwatch-config:ro

  target-db:
    profiles: ["demo"]
    image: postgres:17
    volumes:
      - target_db_data:/var/lib/postgresql/data

volumes:
  postgres_ai_configs:
  pgai_mon_data:
  grafana_data:
  target_db_data:
